# ╔════════════════════════════════════════════════════════════════════╗
# ║                           GENERAL                                  ║
# ╚════════════════════════════════════════════════════════════════════╝

# Prefix
unbind-key C-b
set-option -g prefix C-q
bind-key C-q send-prefix

# Reload config
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"
bind-key R rotate-window

# Indexing
set -g base-index 1
setw -g pane-base-index 1

# Mouse & mode
set -g mouse on
setw -g mode-keys vi

# Terminal, true color & OSC52 clipboard
set -g default-terminal "xterm-256color"
set -g set-clipboard on
set -g terminal-features ",xterm-256color:RGB:clipboard,screen-256color:RGB:clipboard,tmux-256color:RGB:clipboard,wezterm:RGB:clipboard"
set -as terminal-overrides ',*:sitm=\E[3m'
set -as terminal-overrides ',*:Ms=\E]52;c;%p2%s\007'

# Neovim compatibility
set-option -sg escape-time 10
set-option -g focus-events on

# Quality of life
set -g renumber-windows on
setw -g monitor-activity off
set -g visual-activity on
set -g history-limit 50000
set -g display-panes-time 2000
set -g default-command "${SHELL}"
set -g detach-on-destroy on

# ╔════════════════════════════════════════════════════════════════════╗
# ║                        NAVIGATION                                  ║
# ╚════════════════════════════════════════════════════════════════════╝

# Pane focus (vim keys)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Window focus (shift arrows, no prefix)
bind -n S-Left previous-window
bind -n S-Right next-window

# Session / window / pane picker
# NOTE: 'w' and 's' are identical to tmux defaults (choose-tree -Zw/-Zs).
#       'f' overrides default find-window with tmux-fzf (requires plugin install).
bind-key f run-shell -b '~/.tmux/plugins/tmux-fzf/main.sh'
bind-key w choose-tree -Zw
bind-key s choose-tree -Zs

# ╔════════════════════════════════════════════════════════════════════╗
# ║                      PANE MANAGEMENT                               ║
# ╚════════════════════════════════════════════════════════════════════╝

# Splits
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Zoom
bind-key z resize-pane -Z
bind-key m resize-pane -Z

# Resize (repeatable with prefix held)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# Rename pane title
bind-key T command-prompt -p "New pane title: " "select-pane -T '%%'"

# Kill pane (with confirmation)
bind X confirm-before -p "Kill pane? (y/n)" "kill-pane"

# ╔════════════════════════════════════════════════════════════════════╗
# ║                       COPY MODE                                    ║
# ╚════════════════════════════════════════════════════════════════════╝

# Entry
bind Enter copy-mode

# Yank to system clipboard (disabled for headless SSH; keep as reference)
# bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -selection clipboard"
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"

# Visual selection / OSC52 clipboard yank
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# Line navigation
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# Search
bind-key / copy-mode \; send-key ?

# ╔════════════════════════════════════════════════════════════════════╗
# ║                        APPEARANCE                                  ║
# ╚════════════════════════════════════════════════════════════════════╝

# Status bar position
# NOTE: commenting out 'status-position top' does NOT reset it to bottom.
#       You must explicitly set 'bottom' to override a previously-set value.
set -g status-position bottom

# Theme loader
# Toggle the active source-file line in ~/.tmux/theme.conf, then reload with prefix + r.
source-file ~/.tmux/theme.conf

