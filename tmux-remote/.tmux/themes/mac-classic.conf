# Macintosh Classic Mono
# Compact Mac grayscale/paperwhite with Apple Classic neutrals.
# Based on the original retro-pi status layout; only the palette changes.

# Status bar
set -g status-style 'bg=#2C2B2B,fg=#C7C7C7'
set -g status-left-length 50
set -g status-right-length 140
set -g status-interval 10

set -g status-left '#[bg=#FFFFFF,fg=#2C2B2B,bold] #S #[bg=#3A3A3A,fg=#FFFFFF]#[bg=#3A3A3A,fg=#C7C7C7] #I:#P #[bg=#2C2B2B,fg=#3A3A3A] '
set -g status-right '#[fg=#686868]#{?client_prefix,PREFIX ,}#[fg=#D5A200]#(test -x ~/.tmux/scripts/status && ~/.tmux/scripts/status || printf "status off") #[fg=#FFFFFF]#H #[fg=#C7C7C7]%H:%M '

# Window status
set -g window-status-format ' #[fg=#686868]#I:#W#F '
set -g window-status-current-format '#[bg=#FFFFFF,fg=#2C2B2B,bold] #I:#W#F '

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#686868'
set -g pane-active-border-style 'fg=#FFFFFF'
set -g pane-border-status bottom
set -g pane-border-format ' #[fg=#FFFFFF]#{pane_index}#[fg=#686868] │ #[fg=#C7C7C7]#{?pane_title,#{pane_title},#{pane_current_command}} #[fg=#686868]#{b:pane_current_path} '

# Palette reference
# background=#2C2B2B
# foreground=#C7C7C7
# active=#FFFFFF
# metric=#D5A200
# alert=#FF6E67
