# Retro Pi Console theme
# Modern retro palette for SSH into a headless Raspberry Pi.

# Status bar
set -g status-style 'bg=#101418,fg=#d7d0b1'
set -g status-left-length 50
set -g status-right-length 140
set -g status-interval 10

set -g status-left '#[bg=#7fb069,fg=#101418,bold] #S #[bg=#182026,fg=#7fb069]#[bg=#182026,fg=#d7d0b1] #I:#P #[bg=#101418,fg=#182026] '
set -g status-right '#[fg=#6f7f7c]#{?client_prefix,PREFIX ,}#[fg=#d6a04f]#(test -x ~/.tmux/scripts/status && ~/.tmux/scripts/status || printf "status off") #[fg=#7fb069]#H #[fg=#5f8aa3]%H:%M '

# Window status
set -g window-status-format ' #[fg=#6f7f7c]#I:#W#F '
set -g window-status-current-format '#[bg=#7fb069,fg=#101418,bold] #I:#W#F '

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#24313a'
set -g pane-active-border-style 'fg=#7fb069'
set -g pane-border-status bottom
set -g pane-border-format ' #[fg=#7fb069]#{pane_index}#[fg=#6f7f7c] │ #[fg=#d7d0b1]#{?pane_title,#{pane_title},#{pane_current_command}} #[fg=#6f7f7c]#{b:pane_current_path} '
