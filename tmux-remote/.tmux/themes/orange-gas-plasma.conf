# Orange Gas Plasma
# GRiD/Compaq-portable-ish orange plasma glow, grounded in iTerm2 “IC Orange PPL”: fg #FFCB83, cursor #FC531D.
# Based on the original retro-pi status layout; only the palette changes.

# Status bar
set -g status-style 'bg=#262626,fg=#FFCB83'
set -g status-left-length 50
set -g status-right-length 140
set -g status-interval 10

set -g status-left '#[bg=#FC531D,fg=#262626,bold] #S #[bg=#332820,fg=#FC531D]#[bg=#332820,fg=#FFCB83] #I:#P #[bg=#262626,fg=#332820] '
set -g status-right '#[fg=#6A4F2A]#{?client_prefix,PREFIX ,}#[fg=#FFBE55]#(test -x ~/.tmux/scripts/status && ~/.tmux/scripts/status || printf "status off") #[fg=#FC531D]#H #[fg=#FC874F]%H:%M '

# Window status
set -g window-status-format ' #[fg=#6A4F2A]#I:#W#F '
set -g window-status-current-format '#[bg=#FC531D,fg=#262626,bold] #I:#W#F '

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#6A4F2A'
set -g pane-active-border-style 'fg=#FC531D'
set -g pane-border-status bottom
set -g pane-border-format ' #[fg=#FC531D]#{pane_index}#[fg=#6A4F2A] │ #[fg=#FFCB83]#{?pane_title,#{pane_title},#{pane_current_command}} #[fg=#6A4F2A]#{b:pane_current_path} '

# Palette reference
# background=#262626
# foreground=#FFCB83
# active=#FC531D
# metric=#FFBE55
# alert=#FF8C68
