# Catppuccine theme (current)

# Status bar
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left-length 50
set -g status-right-length 140
set -g status-interval 10

set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#313244,fg=#89b4fa]#[bg=#313244,fg=#cdd6f4] #I:#P #[bg=#1e1e2e,fg=#313244] '
set -g status-right '#[fg=#6c7086]#{?client_prefix,PREFIX ,}#[fg=#f9e2af]#(test -x ~/.tmux/scripts/status && ~/.tmux/scripts/status || printf "status off") #[fg=#a6e3a1]#H #[fg=#89b4fa]%H:%M '

# Window status
set -g window-status-format ' #[fg=#6c7086]#I:#W#F '
set -g window-status-current-format '#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W#F '

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
set -g pane-border-status bottom
set -g pane-border-format ' #[fg=#89b4fa]#{pane_index}#[fg=#6c7086] │ #[fg=#cdd6f4]#{?pane_title,#{pane_title},#{pane_current_command}} #[fg=#6c7086]#{b:pane_current_path} '
