# Nord theme

# Status bar
set -g status-style 'bg=#2e3440,fg=#d8dee9'
set -g status-left-length 50
set -g status-right-length 140
set -g status-interval 10

set -g status-left '#[bg=#88c0d0,fg=#2e3440,bold] #S #[bg=#3b4252,fg=#88c0d0]#[bg=#3b4252,fg=#e5e9f0] #I:#P #[bg=#2e3440,fg=#3b4252] '
set -g status-right '#[fg=#4c566a]#{?client_prefix,PREFIX ,}#[fg=#ebcb8b]#(test -x ~/.tmux/scripts/status && ~/.tmux/scripts/status || printf "status off") #[fg=#a3be8c]#H #[fg=#81a1c1]%H:%M '

# Window status
set -g window-status-format ' #[fg=#4c566a]#I:#W#F '
set -g window-status-current-format '#[bg=#88c0d0,fg=#2e3440,bold] #I:#W#F '

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#4c566a'
set -g pane-active-border-style 'fg=#88c0d0'
set -g pane-border-status bottom
set -g pane-border-format ' #[fg=#88c0d0]#{pane_index}#[fg=#4c566a] │ #[fg=#d8dee9]#{?pane_title,#{pane_title},#{pane_current_command}} #[fg=#4c566a]#{b:pane_current_path} '
