# Apply natural scrolling to all pointer devices handled by Xorg/libinput.
# Installed by ~/.dotfiles/scripts/stow-host.sh to:
#   /etc/X11/xorg.conf.d/40-libinput-natural-scrolling.conf
#
# This reverses libinput's default wheel direction so wheel-up scrolls the page
# up and wheel-down scrolls the page down on this setup, consistently for newly
# connected mice as well as existing pointer devices.
Section "InputClass"
    Identifier "libinput pointer natural scrolling"
    MatchIsPointer "on"
    Driver "libinput"
    Option "NaturalScrolling" "true"
EndSection
