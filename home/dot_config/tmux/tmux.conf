# ═══════════════════════════════════════════════════════════════════
# Omarchy tmux config — chezmoi-managed on thinkpad.
# Base: Omarchy seed (/usr/share/omarchy/config/tmux/tmux.conf)
#       + personal T-layer notes from omarchy_config.md
#       + personal TPM plugins (resurrect/continuum/fzf).
# Live path: ~/.config/tmux/tmux.conf (tmux 3.7 loads this before ~/.tmux.conf).
# ═══════════════════════════════════════════════════════════════════

# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind -N "Send prefix" C-Space send-prefix

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# Vi mode for copy (Omarchy: plain copy, no OSC52 pipe)
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Enter copy mode (prefix + Enter; tmux default prefix + [ still works)
bind -N "Enter copy mode" Enter copy-mode

# Pane Controls
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

bind -N "Split pane vertically" - split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

# Focus panes with vim keys (replaces Omarchy's C-M arrows)
bind -N "Focus pane left" h select-pane -L
bind -N "Focus pane down" j select-pane -D
bind -N "Focus pane up" k select-pane -U
bind -N "Focus pane right" l select-pane -R

# Resize panes — Omarchy's no-prefix chord, h/j/k/l instead of arrows
bind -N "Resize pane left" -n C-M-S-h resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-j resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-k resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-l resize-pane -R 5

# Zoom pane toggle
bind -N "Zoom pane" z resize-pane -Z
bind -N "Zoom pane" m resize-pane -Z

# Rename pane title
bind -N "Rename pane" T command-prompt -p "New pane title: " "select-pane -T '%%'"

# Respawn a dead (remain-on-exit) pane
bind -N "Respawn pane" C-r respawn-pane -k

# Window navigation
bind -N "Rename window" , command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
# Kill window on the tmux default key (k is focus-up)
bind -N "Kill window" & kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Previous window" -n 'M-{' select-window -t -1
bind -N "Next window" -n 'M-}' select-window -t +1
bind -N "Previous window" -n S-Left select-window -t -1
bind -N "Next window" -n S-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n
bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# Detach
bind -N "Detach" d detach-client

# Pickers
bind -N "Choose window" w choose-tree -Zw
bind -N "Choose session" s choose-tree -Zs
bind -N "Find window (fzf)" f run-shell -b '~/.tmux/plugins/tmux-fzf/main.sh'

# tmux-fingers: prefix+F (fingers) and prefix+G (jump) are set via the
# @fingers-key / @fingers-jump-key options in the Plugins section below.

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar (personal style: bottom bar + per-host theme)
set -g status-position bottom
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{?#{m/r:(bash|zsh|fish|sh)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme: per-host selection rendered by ~/.tmux/theme.conf
# (hostFacts.<host>.tmuxTheme; blue-matrix on thinkpad)
source-file ~/.tmux/theme.conf

# ═══════════════════════════════════════════════════════════════════
# Plugins (personal; cloned by run_after_ensure-tmux-plugins.sh)
# ═══════════════════════════════════════════════════════════════════
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes ':all:'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

set -g @plugin 'sainnhe/tmux-fzf'
set -g @tmux-fzf-bin 'fzf'
set -g @tmux-fzf-options "-p -w 85% -h 85%"

set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-key F
set -g @fingers-jump-key G

# TPM init (must be last)
run '~/.tmux/plugins/tpm/tpm'
