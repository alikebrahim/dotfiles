# Green Phosphor / Retro terminal
# Monochrome green terminal, grounded in iTerm2 “Retro” (#13A10E/#16BA10) and “SeedFlip Phosphor”.
# Based on the original retro-pi status layout; only the palette changes.

# Status bar
set -g status-style 'bg=#000000,fg=#13A10E'
set -g status-left-length 50
set -g status-right-length 140
set -g status-interval 10

set -g status-left '#[bg=#16BA10,fg=#000000,bold] #S #[bg=#061406,fg=#16BA10]#[bg=#061406,fg=#13A10E] #I:#P #[bg=#000000,fg=#061406] '
set -g status-right '#[fg=#0B7A09]#{?client_prefix,PREFIX ,}#[fg=#42F07C]#(test -x ~/.tmux/scripts/status && ~/.tmux/scripts/status || printf "status off") #[fg=#16BA10]#H #[fg=#45EB45]%H:%M '

# Window status
set -g window-status-format ' #[fg=#0B7A09]#I:#W#F '
set -g window-status-current-format '#[bg=#16BA10,fg=#000000,bold] #I:#W#F '

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#014401'
set -g pane-active-border-style 'fg=#16BA10'
set -g pane-border-status bottom
set -g pane-border-format ' #[fg=#16BA10]#{pane_index}#[fg=#0B7A09] │ #[fg=#13A10E]#{?pane_title,#{pane_title},#{pane_current_command}} #[fg=#0B7A09]#{b:pane_current_path} '

# Palette reference
# background=#000000
# foreground=#13A10E
# active=#16BA10
# metric=#42F07C
# alert=#F0D342
