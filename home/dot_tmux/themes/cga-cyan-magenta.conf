# IBM CGA Cyan/Magenta
# Canonical CGA cyan/magenta/yellow on blue-black: #55FFFF, #FF55FF, #FFFF55.
# Based on the original retro-pi status layout; only the palette changes.

# Status bar
set -g status-style 'bg=#000000,fg=#AAAAAA'
set -g status-left-length 50
set -g status-right-length 140
set -g status-interval 10

set -g status-left '#[bg=#FF55FF,fg=#000000,bold] #S #[bg=#0000AA,fg=#FF55FF]#[bg=#0000AA,fg=#AAAAAA] #I:#P #[bg=#000000,fg=#0000AA] '
set -g status-right '#[fg=#55FFFF]#{?client_prefix,PREFIX ,}#[fg=#FFFF55]#(test -x ~/.tmux/scripts/status && ~/.tmux/scripts/status || printf "status off") #[fg=#FF55FF]#H #[fg=#55FFFF]%H:%M '

# Window status
set -g window-status-format ' #[fg=#55FFFF]#I:#W#F '
set -g window-status-current-format '#[bg=#FF55FF,fg=#000000,bold] #I:#W#F '

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#00AAAA'
set -g pane-active-border-style 'fg=#FF55FF'
set -g pane-border-status bottom
set -g pane-border-format ' #[fg=#FF55FF]#{pane_index}#[fg=#55FFFF] │ #[fg=#AAAAAA]#{?pane_title,#{pane_title},#{pane_current_command}} #[fg=#55FFFF]#{b:pane_current_path} '

# Palette reference
# background=#000000
# foreground=#AAAAAA
# active=#FF55FF
# metric=#FFFF55
# alert=#FF5555
