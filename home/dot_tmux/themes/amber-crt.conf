# Amber CRT / Trapped in Amber
# Warm P3 phosphor amber, grounded in iTerm2 “Trapped in Amber”: bg #0A1017, fg #F0A020, cursor #FFC940.
# Based on the original retro-pi status layout; only the palette changes.

# Status bar
set -g status-style 'bg=#0A1017,fg=#F0A020'
set -g status-left-length 50
set -g status-right-length 140
set -g status-interval 10

set -g status-left '#[bg=#F0A020,fg=#0A1017,bold] #S #[bg=#1A1610,fg=#F0A020]#[bg=#1A1610,fg=#F0A020] #I:#P #[bg=#0A1017,fg=#1A1610] '
set -g status-right '#[fg=#5A4A3A]#{?client_prefix,PREFIX ,}#[fg=#FFD700]#(test -x ~/.tmux/scripts/status && ~/.tmux/scripts/status || printf "status off") #[fg=#F0A020]#H #[fg=#FF7832]%H:%M '

# Window status
set -g window-status-format ' #[fg=#5A4A3A]#I:#W#F '
set -g window-status-current-format '#[bg=#F0A020,fg=#0A1017,bold] #I:#W#F '

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#4A3220'
set -g pane-active-border-style 'fg=#F0A020'
set -g pane-border-status bottom
set -g pane-border-format ' #[fg=#F0A020]#{pane_index}#[fg=#5A4A3A] │ #[fg=#F0A020]#{?pane_title,#{pane_title},#{pane_current_command}} #[fg=#5A4A3A]#{b:pane_current_path} '

# Palette reference
# background=#0A1017
# foreground=#F0A020
# active=#F0A020
# metric=#FFD700
# alert=#FF7832
