# IBM 5153 CGA Monitor
# Softer CRT-rendered CGA values from the IBM 5153 CGA scheme.
# Based on the original retro-pi status layout; only the palette changes.

# Status bar
set -g status-style 'bg=#141414,fg=#CECECE'
set -g status-left-length 50
set -g status-right-length 140
set -g status-interval 10

set -g status-left '#[bg=#1BD0D0,fg=#141414,bold] #S #[bg=#1C2630,fg=#1BD0D0]#[bg=#1C2630,fg=#CECECE] #I:#P #[bg=#141414,fg=#1C2630] '
set -g status-right '#[fg=#4E4E4E]#{?client_prefix,PREFIX ,}#[fg=#F3F34E]#(test -x ~/.tmux/scripts/status && ~/.tmux/scripts/status || printf "status off") #[fg=#1BD0D0]#H #[fg=#F34EF3]%H:%M '

# Window status
set -g window-status-format ' #[fg=#4E4E4E]#I:#W#F '
set -g window-status-current-format '#[bg=#1BD0D0,fg=#141414,bold] #I:#W#F '

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#4E4E4E'
set -g pane-active-border-style 'fg=#1BD0D0'
set -g pane-border-status bottom
set -g pane-border-format ' #[fg=#1BD0D0]#{pane_index}#[fg=#4E4E4E] │ #[fg=#CECECE]#{?pane_title,#{pane_title},#{pane_current_command}} #[fg=#4E4E4E]#{b:pane_current_path} '

# Palette reference
# background=#141414
# foreground=#CECECE
# active=#1BD0D0
# metric=#F3F34E
# alert=#DC4E4E
