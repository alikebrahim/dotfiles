# Kanawagwa Wave theme

# Status bar
set -g status-style 'bg=#1f1f28,fg=#dcd7ba'
set -g status-left-length 50
set -g status-right-length 140
set -g status-interval 10

set -g status-left '#[bg=#7e9cd8,fg=#1f1f28,bold] #S #[bg=#2a2a37,fg=#7e9cd8]#[bg=#2a2a37,fg=#dcd7ba] #I:#P #[bg=#1f1f28,fg=#2a2a37] '
set -g status-right '#[fg=#727169]#{?client_prefix,PREFIX ,}#[fg=#c0a36e]#(test -x ~/.tmux/scripts/status && ~/.tmux/scripts/status || printf "status off") #[fg=#98bb6c]#H #[fg=#7e9cd8]%H:%M '

# Window status
set -g window-status-format ' #[fg=#727169]#I:#W#F '
set -g window-status-current-format '#[bg=#7e9cd8,fg=#1f1f28,bold] #I:#W#F '

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#54546d'
set -g pane-active-border-style 'fg=#7e9cd8'
set -g pane-border-status bottom
set -g pane-border-format ' #[fg=#7e9cd8]#{pane_index}#[fg=#727169] │ #[fg=#dcd7ba]#{?pane_title,#{pane_title},#{pane_current_command}} #[fg=#727169]#{b:pane_current_path} '
