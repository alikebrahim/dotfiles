# Commodore 64 Blue
# C64 screen blue/lavender, grounded in C64/iTerm2 values: bg #40318D, fg #7869C4.
# Based on the original retro-pi status layout; only the palette changes.

# Status bar
set -g status-style 'bg=#40318D,fg=#7869C4'
set -g status-left-length 50
set -g status-right-length 140
set -g status-interval 10

set -g status-left '#[bg=#AAFFEE,fg=#40318D,bold] #S #[bg=#352879,fg=#AAFFEE]#[bg=#352879,fg=#7869C4] #I:#P #[bg=#40318D,fg=#352879] '
set -g status-right '#[fg=#67B6BD]#{?client_prefix,PREFIX ,}#[fg=#EEEE77]#(test -x ~/.tmux/scripts/status && ~/.tmux/scripts/status || printf "status off") #[fg=#AAFFEE]#H #[fg=#BFCE72]%H:%M '

# Window status
set -g window-status-format ' #[fg=#67B6BD]#I:#W#F '
set -g window-status-current-format '#[bg=#AAFFEE,fg=#40318D,bold] #I:#W#F '

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#0000AA'
set -g pane-active-border-style 'fg=#AAFFEE'
set -g pane-border-status bottom
set -g pane-border-format ' #[fg=#AAFFEE]#{pane_index}#[fg=#67B6BD] │ #[fg=#7869C4]#{?pane_title,#{pane_title},#{pane_current_command}} #[fg=#67B6BD]#{b:pane_current_path} '

# Palette reference
# background=#40318D
# foreground=#7869C4
# active=#AAFFEE
# metric=#EEEE77
# alert=#FF7777
