# Blue Matrix
# Cool blue terminal/glass CRT signal, grounded in iTerm2 “Blue Matrix”: bg #101116, fg #00A2FF.
# Based on the original retro-pi status layout; only the palette changes.

# Status bar
set -g status-style 'bg=#101116,fg=#00A2FF'
set -g status-left-length 50
set -g status-right-length 140
set -g status-interval 10

set -g status-left '#[bg=#00B0FF,fg=#101116,bold] #S #[bg=#15212A,fg=#00B0FF]#[bg=#15212A,fg=#00A2FF] #I:#P #[bg=#101116,fg=#15212A] '
set -g status-right '#[fg=#76C1FF]#{?client_prefix,PREFIX ,}#[fg=#76FF9F]#(test -x ~/.tmux/scripts/status && ~/.tmux/scripts/status || printf "status off") #[fg=#00B0FF]#H #[fg=#60FDFF]%H:%M '

# Window status
set -g window-status-format ' #[fg=#76C1FF]#I:#W#F '
set -g window-status-current-format '#[bg=#00B0FF,fg=#101116,bold] #I:#W#F '

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#243040'
set -g pane-active-border-style 'fg=#00B0FF'
set -g pane-border-status bottom
set -g pane-border-format ' #[fg=#00B0FF]#{pane_index}#[fg=#76C1FF] │ #[fg=#00A2FF]#{?pane_title,#{pane_title},#{pane_current_command}} #[fg=#76C1FF]#{b:pane_current_path} '

# Palette reference
# background=#101116
# foreground=#00A2FF
# active=#00B0FF
# metric=#76FF9F
# alert=#FF5680
